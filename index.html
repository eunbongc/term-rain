<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIS 타자 연습 — 산성비 (Term Rain)</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body {
  font-family:'Consolas','D2Coding','Courier New',monospace;
  background:#05070a; color:#e6f0e6;
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; padding:16px; overflow:hidden;
}
.wrap { width:100%; max-width:780px; }

/* CRT 모니터 프레임 */
.crt {
  position:relative; background:#0a0f0c;
  border:2px solid #1d2a1f; border-radius:14px;
  box-shadow:0 0 0 6px #0c110d, 0 0 40px rgba(0,255,120,0.08), inset 0 0 60px rgba(0,40,10,0.4);
  overflow:hidden;
}
/* 스캔라인 */
.crt::before {
  content:''; position:absolute; inset:0; pointer-events:none; z-index:40;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.18) 3px, rgba(0,0,0,0) 4px);
}
/* 화면 비네팅 */
.crt::after {
  content:''; position:absolute; inset:0; pointer-events:none; z-index:41;
  box-shadow:inset 0 0 120px rgba(0,0,0,0.7);
  border-radius:14px;
}

/* 상단 HUD */
.hud {
  display:flex; justify-content:space-between; align-items:center;
  padding:10px 16px; border-bottom:1px solid #16241a;
  font-size:13px; color:#7dffb0; letter-spacing:1px; z-index:30; position:relative;
  text-shadow:0 0 6px rgba(80,255,150,0.5);
}
.hud .seg { display:flex; gap:16px; }
.hud b { color:#eafff0; }
.hud .lives { color:#ff9d5c; text-shadow:0 0 6px rgba(255,130,60,0.5); }
#pauseBtn {
  font-family:inherit; font-size:12px; color:#7dffb0; background:#0c1a10;
  border:1px solid #2bff88; border-radius:4px; padding:2px 8px; cursor:pointer;
  text-shadow:0 0 6px rgba(80,255,150,0.5); letter-spacing:0;
}
#pauseBtn:hover { background:#102617; }
/* 남은 시간 바 */
.timebar { position:relative; z-index:30; height:4px; background:#0d140f; }
.timebar .tfill { height:100%; background:linear-gradient(90deg,#2bff88,#7dffb0); box-shadow:0 0 8px #2bff88; width:100%; transition:width .2s linear; }
.timebar .tfill.low { background:linear-gradient(90deg,#ff6b4a,#ffcf7a); box-shadow:0 0 8px #ff6b4a; }

/* 게임 플레이 영역 */
#field {
  position:relative; height:520px; overflow:hidden;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(0,80,30,0.25), transparent 60%),
    #060a07;
  z-index:10;
}
/* 바닥 경계선 */
.ground {
  position:absolute; left:0; right:0; bottom:0; height:2px;
  background:linear-gradient(90deg, transparent, #2bff88, transparent);
  box-shadow:0 0 12px #2bff88; z-index:20;
}

/* 떨어지는 용어 */
.drop {
  position:absolute; white-space:nowrap;
  font-size:22px; font-weight:700; letter-spacing:1px;
  color:#8affc0; text-shadow:0 0 8px rgba(60,255,140,0.6);
  padding:3px 10px; border:1px solid rgba(90,255,150,0.25);
  border-radius:4px; background:rgba(10,30,15,0.5);
  transform:translateX(-50%);
}
.drop .typed { color:#fff4b0; text-shadow:0 0 10px rgba(255,220,90,0.9); }
.drop.amber { color:#ffcf7a; text-shadow:0 0 8px rgba(255,170,70,0.6); border-color:rgba(255,180,90,0.3); }
.drop.trap { color:#ff6b6b; text-shadow:0 0 10px rgba(255,70,70,0.7); border-color:rgba(255,90,90,0.45); background:rgba(40,10,12,0.55); animation:trapGlitch 1.2s infinite; }
.drop.trap .typed { color:#fff; }

/* 빨간 알약 — 💊 느낌: 반 흰/반 빨강 캡슐, 역대각선 기울기, 구석에 숨김. 호기심에 눌러보는 사람만 발견하도록 소심하게 */
.redpill {
  position:absolute; right:16px; bottom:16px;
  width:32px; height:13px; border-radius:7px; cursor:pointer; padding:0; border:none;
  background:linear-gradient(90deg, #d8d8d8 0%, #d8d8d8 49%, #a83030 51%, #c85a5a 100%);
  box-shadow:inset 0 1px 1px rgba(255,255,255,0.3), inset 0 -1px 1px rgba(0,0,0,0.25);
  transform:rotate(-45deg); opacity:0.3;
  transition:opacity .25s;
}
.redpill::after {
  content:''; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:1px; height:13px; background:rgba(0,0,0,0.18);
}
.redpill:hover { opacity:0.5; }

/* 빨간약 채팅 */
/* 빨간약 독백 — 매트릭스풍 CRT 터미널 */
.chat {
  position:absolute; inset:0; z-index:22; padding:40px 34px 60px;
  display:flex; flex-direction:column; justify-content:center; overflow-y:auto;
  background:radial-gradient(ellipse at 50% 40%, rgba(0,40,15,0.35), #02050a 75%);
}
.mono {
  max-width:620px; margin:0 auto; width:100%;
  color:#7dffb0; font-size:16px; line-height:1.95;
  text-shadow:0 0 7px rgba(60,255,140,0.45);
  white-space:pre-wrap; word-break:keep-all;
}
.mono b { color:#fff4b0; text-shadow:0 0 8px rgba(255,230,120,0.5); }
.mono .dim { color:#5fae82; text-shadow:none; }
.mono .q { color:#baffd6; }
.mono .cursor { display:inline-block; width:9px; margin-left:1px;
  background:#7dffb0; box-shadow:0 0 8px rgba(60,255,140,0.7);
  animation:monoBlink 0.9s step-end infinite; }
@keyframes monoBlink { 0%,100%{opacity:1;} 50%{opacity:0;} }
.mono-hint {
  max-width:620px; margin:18px auto 0; width:100%;
  color:#4f8f6a; font-size:12px; letter-spacing:1px;
  opacity:0; transition:opacity .4s;
}
.mono-hint.show { opacity:0.9; }
/* CRT 스캔라인 */
.chat::before {
  content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.12) 3px, rgba(0,0,0,0) 4px);
}
.chat .mono, .chat .mono-hint { position:relative; z-index:2; }

/* 채팅이 끝나면 빨간약 대신 파란약을 띄움 — 누르면 첫 화면으로 */
.bluepill {
  position:absolute; left:50%; bottom:20px; z-index:30;
  width:44px; height:18px; border-radius:9px; cursor:pointer; padding:0; border:none;
  background:linear-gradient(90deg, #d8d8d8 0%, #d8d8d8 49%, #2f5fd0 51%, #6f9bff 100%);
  box-shadow:inset 0 1px 1px rgba(255,255,255,0.35), inset 0 -1px 1px rgba(0,0,0,0.25);
  transform:translateX(-50%) rotate(-45deg); opacity:0; pointer-events:none;
  transition:opacity .8s;
}
.bluepill::after {
  content:''; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:1px; height:18px; background:rgba(0,0,0,0.18);
}
.bluepill.show { opacity:0.85; pointer-events:auto; }
.bluepill.show:hover { opacity:1; }
@keyframes trapGlitch { 0%,100%{transform:translateX(-50%);} 48%{transform:translateX(-50%);} 50%{transform:translate(calc(-50% - 2px),1px);} 52%{transform:translate(calc(-50% + 2px),-1px);} 54%{transform:translateX(-50%);} }

/* "아니야~!" 오버레이 */
.nope {
  position:absolute; inset:0; z-index:45; display:none;
  align-items:center; justify-content:center; flex-direction:column; text-align:center;
  background:rgba(60,8,8,0.55); backdrop-filter:blur(1px);
}
.nope .big { font-size:40px; font-weight:800; color:#ff5555; letter-spacing:4px; text-shadow:0 0 20px rgba(255,60,60,0.8); }
.nope .sub { font-size:13px; color:#ffd9d9; margin-top:8px; line-height:1.6; }
.nope .sub b { color:#ff9d9d; }
#field.shake { animation:shake .4s; }
@keyframes shake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);} 40%{transform:translateX(6px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(4px);} }
.drop.amber .typed { color:#fff; }

/* 입력창 */
.inputbar {
  position:relative; z-index:30; padding:12px 16px; border-top:1px solid #16241a;
  display:flex; align-items:center; gap:10px; background:#070c08;
}
.prompt { color:#2bff88; font-size:16px; text-shadow:0 0 6px #2bff88; }
#typed {
  flex:1; background:transparent; border:none; outline:none;
  color:#eafff0; font-family:inherit; font-size:16px; letter-spacing:1px;
  text-shadow:0 0 6px rgba(150,255,180,0.5);
}
#typed::placeholder { color:#2f5f3f; }

/* 용어 맞힌 자리에 뜻 팝업 */
.meaning-pop {
  position:absolute; z-index:28; transform:translate(-50%,-50%);
  background:rgba(8,20,12,0.92); border:1px solid rgba(90,255,150,0.4);
  border-radius:6px; padding:6px 12px; font-size:12.5px; color:#cdeed6; line-height:1.5;
  white-space:nowrap; max-width:90vw; pointer-events:none;
  text-shadow:0 0 4px rgba(60,200,120,0.4); opacity:0; transition:opacity .25s, transform .9s ease-out;
}
.meaning-pop b { color:#fff4b0; }
.meaning-pop.fade { opacity:1; transform:translate(-50%,-150%); }

/* 오버레이 (시작/종료) */
.overlay {
  position:absolute; inset:0; z-index:50;
  background:rgba(4,8,6,0.94);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:40px 30px;
}
.overlay h1 {
  font-size:38px; color:#2bff88; letter-spacing:6px; margin-bottom:8px;
  text-shadow:0 0 14px rgba(43,255,136,0.7); animation:flicker 3s infinite;
}
@keyframes flicker { 0%,96%,100%{opacity:1;} 97%{opacity:0.6;} 98%{opacity:1;} 99%{opacity:0.7;} }
.overlay .tagline { font-size:12px; color:#6fae85; letter-spacing:2px; margin-bottom:30px; }
.overlay p { font-size:13px; color:#add8bb; line-height:2; margin-bottom:6px; }
.overlay .blink { animation:blink 1.6s steps(2,start) infinite; color:#fff4b0; margin-top:26px; font-size:15px; }
@keyframes blink { to { visibility:hidden; } }
.btn {
  margin-top:20px; padding:12px 30px; font-family:inherit; font-size:15px; letter-spacing:2px;
  background:#0c1a10; color:#7dffb0; border:1px solid #2bff88; border-radius:6px; cursor:pointer;
  text-shadow:0 0 6px rgba(80,255,150,0.5); box-shadow:0 0 16px rgba(43,255,136,0.2);
}
.btn:hover { background:#123; background:#102617; box-shadow:0 0 24px rgba(43,255,136,0.4); }
.mode-row { display:flex; gap:12px; margin-top:16px; flex-wrap:wrap; justify-content:center; }

/* 인게임 음소거 버튼 */
#muteBtn {
  font-family:inherit; font-size:12px; color:#7dffb0; background:#0c1a10;
  border:1px solid #2bff88; border-radius:4px; padding:2px 7px; cursor:pointer;
  text-shadow:0 0 6px rgba(80,255,150,0.5); letter-spacing:0; margin-right:6px;
}
#muteBtn:hover { background:#102617; }
#muteBtn.muted { color:#5f6f64; border-color:#2a3a30; text-shadow:none; box-shadow:none; }
.result-score { font-size:46px; color:#fff4b0; text-shadow:0 0 16px rgba(255,220,90,0.7); margin:8px 0; }
.result-line { font-size:13px; color:#add8bb; margin:3px 0; }
.title-click { cursor:pointer; }

.legend { text-align:center; font-size:10.5px; color:#3f6b4f; margin-top:10px; letter-spacing:1px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="crt">
    <div class="hud" id="hudGame">
      <div class="seg">
        <span>SCORE <b id="score">0</b></span>
        <span>LV <b id="level">1</b></span>
        <span>COMBO <b id="combo">0</b></span>
      </div>
      <div class="seg">
        <span>TIME <b id="time">0</b></span>
        <span class="lives" id="lives">♥ ♥ ♥</span>
        <button id="muteBtn" onclick="toggleMute()">♪ ON</button>
        <button id="pauseBtn" onclick="togglePause()">❚❚</button>
      </div>
    </div>

    <div class="timebar"><div class="tfill" id="tfill"></div></div>

    <div id="field">
      <div class="ground"></div>

      <!-- 함정 단어 입력 시 "아니야~!" -->
      <div class="nope" id="nopeOverlay">
        <div class="big">❌ 아니야~!</div>
        <div class="sub" id="nopeMsg"></div>
      </div>

      <!-- 채팅이 끝나면 여기서 파란약이 떠오름 -->
      <button class="bluepill" id="bluepillBtn" onclick="backToStart()" title="돌아가기" aria-label="돌아가기"></button>

      <!-- 시작 오버레이 -->
      <div class="overlay" id="startOverlay">
        <h1>TERM RAIN</h1>
        <div class="tagline"></div>
        <p style="color:#6fae85; font-size:12px;">대소문자·공백은 무시됩니다</p>
        <div class="mode-row">
          <button class="btn" onclick="startGame('easy')">EASY</button>
          <button class="btn" onclick="startGame('normal')">NORMAL</button>
          <button class="btn" onclick="startGame('hard')">HARD</button>
        </div>
        <div id="startHigh" style="font-size:10.5px; color:#4f8060; letter-spacing:1px; margin-top:16px;">HIGH SCORE &nbsp; EASY <b>0</b> &nbsp;·&nbsp; NORMAL <b>0</b> &nbsp;·&nbsp; HARD <b>0</b></div>
        <div class="blink">▶ 난이도를 선택하세요</div>
        <button class="redpill" onclick="startGame('redpill')" title="?" aria-label="?"></button>
      </div>

      <!-- 일시정지 오버레이 -->
      <div class="overlay" id="pauseOverlay" style="display:none;">
        <h1 style="font-size:24px;">PAUSED</h1>
        <p>잠시 멈췄습니다.</p>
        <button class="btn" onclick="togglePause()">▶ 계속하기</button>
        <div style="margin-top:14px;"><button class="btn" style="font-size:12px; padding:8px 18px;" onclick="backToStart()">■ 그만두기</button></div>
      </div>

      <!-- 종료 오버레이 -->
      <div class="overlay" id="endOverlay" style="display:none;">
        <h1 style="font-size:24px;" id="endHead">GAME OVER</h1>
        <div class="result-score" id="finalScore">0</div>
        <div class="result-line">맞힌 용어 <b id="finalHits" style="color:#8affc0;">0</b> · 최고 콤보 <b id="finalCombo" style="color:#ffcf7a;">0</b></div>
        <div class="result-line">명중률 <b id="finalAcc" style="color:#8affc0;">0%</b></div>
        <div class="result-line" id="finalGrade" style="font-size:15px; color:#fff4b0; margin-top:10px;"></div>
        <div class="result-line" id="finalRecord" style="font-size:13px; margin-top:8px; letter-spacing:1px;"></div>
        <button class="btn" onclick="backToStart()">▶ 다시 하기</button>
      </div>
    </div>

    <div class="inputbar">
      <span class="prompt">&gt;</span>
      <input id="typed" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="여기에 타이핑…">
    </div>
  </div>
  <div class="legend">
    용어·뜻은 모두 'MIS 깊이 보기' 자료 기반 · 바이브 코딩 미니게임
  </div>
</div>

<script>
// ============================================================
// 사운드 엔진 — Web Audio API로 실시간 합성 (오디오 파일 불필요)
// 효과음 + BGM(밝게/차분하게/무음). 8비트 칩튠 느낌.
// ============================================================
var AudioEngine = (function(){
  var ctx=null, master=null;
  var soundMode='bright';   // bright | calm | off
  var muted=false;
  var bgmTimer=null, bgmStep=0;

  // 밝은 모드: 통통 튀는 메이저 아르페지오 / 차분한 모드: 느린 패드풍
  var BGM = {
    bright: { tempo:150, notes:[523.25,659.25,783.99,659.25, 587.33,698.46,880.0,698.46, 523.25,659.25,783.99,1046.5, 783.99,659.25,587.33,523.25], type:'square', gain:0.05, len:0.14 },
    calm:   { tempo:300, notes:[261.63,329.63,392.0,329.63, 293.66,349.23,440.0,349.23, 261.63,329.63,392.0,329.63, 220.0,261.63,329.63,261.63], type:'triangle', gain:0.045, len:0.5 }
  };

  function ensure(){
    if(!ctx){
      try { ctx = new (window.AudioContext||window.webkitAudioContext)(); }
      catch(e){ return false; }
      master = ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
    }
    if(ctx.state==='suspended') ctx.resume();
    return true;
  }

  // 단음 합성
  function blip(freq, dur, type, gain, slideTo){
    if(muted || soundMode==='off' || !ensure()) return;
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type||'square';
    var t=ctx.currentTime;
    o.frequency.setValueAtTime(freq, t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain||0.12, t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+dur+0.02);
  }

  // 효과음들
  var SFX = {
    hit:   function(){ blip(880, 0.10, 'square', 0.11, 1320); },      // 명중 상승음
    combo: function(n){ var f=660+Math.min(n,12)*60; blip(f,0.10,'square',0.11, f*1.4); }, // 콤보 높아짐
    miss:  function(){ blip(220, 0.22, 'sawtooth', 0.12, 90); },      // 하강 버저
    trap:  function(){ blip(160,0.18,'sawtooth',0.13,120); setTimeout(function(){blip(130,0.28,'sawtooth',0.13,80);},120); }, // 야유음(더 낮게 꽝)
    level: function(){ blip(784,0.09,'square',0.1,0); setTimeout(function(){blip(1046,0.12,'square',0.1,0);},90); },
    over:  function(){ blip(392,0.18,'square',0.1,0); setTimeout(function(){blip(294,0.18,'square',0.1,0);},160); setTimeout(function(){blip(196,0.35,'square',0.1,0);},320); },
    record:function(){ [523,659,784,1046].forEach(function(f,i){ setTimeout(function(){blip(f,0.14,'square',0.11,0);}, i*110); }); },
    start: function(){ blip(523,0.08,'square',0.1,0); setTimeout(function(){blip(784,0.12,'square',0.1,0);},90); }
  };

  function startBGM(){
    stopBGM();
    if(muted || soundMode==='off' || !BGM[soundMode] || !ensure()) return;
    var cfg=BGM[soundMode]; bgmStep=0;
    var beat = 60000/cfg.tempo;
    bgmTimer=setInterval(function(){
      var f=cfg.notes[bgmStep % cfg.notes.length];
      if(f) blip(f, cfg.len, cfg.type, cfg.gain, 0);
      bgmStep++;
    }, beat);
  }
  function stopBGM(){ if(bgmTimer){ clearInterval(bgmTimer); bgmTimer=null; } }

  return {
    setMode:function(m){ soundMode=m; },
    getMode:function(){ return soundMode; },
    setMuted:function(b){ muted=b; if(b) stopBGM(); },
    isMuted:function(){ return muted; },
    sfx:SFX,
    startBGM:startBGM,
    stopBGM:stopBGM,
    resume:function(){ ensure(); }
  };
})();

function toggleMute(){
  var m=!AudioEngine.isMuted();
  AudioEngine.setMuted(m);
  var btn=document.getElementById('muteBtn');
  btn.textContent = m ? '♪ OFF' : '♪ ON';
  btn.classList.toggle('muted', m);
  if(!m && running && !paused) AudioEngine.startBGM();
}

// ============================================================
// 용어 데이터 — 모두 mis-briefing 깊이보기 6편 + 컴퓨팅-AI-역사.html 근거
// term: 타이핑할 영어 용어 / ko: 한 줄 뜻(학습용)
// ============================================================
var TERMS = [
  { term:"ENIAC", ko:"1946년, 최초의 전자식 컴퓨터 (중앙집중 시대)" },
  { term:"UNIVAC", ko:"1951년, 최초의 상용 컴퓨터" },
  { term:"Apple I", ko:"1976년, 최초의 PC" },
  { term:"IBM PC", ko:"1981년 PC 표준 → 2005년 레노버에 매각" },
  { term:"UNIX", ko:"1969년 벨연구소 운영체제" },

// ============================================================
var field = document.getElementById('field');
var fieldH, fieldW;
var drops = [];           // 활성 용어들
var spawnTimer = 0, rafId = null, lastTs = 0;
var score=0, combo=0, maxCombo=0, hits=0, misses=0, level=1, lives=3;
var running=false, paused=false;
var timeLeft=0, timeTotal=0;
var cfg = {}, curMode='normal';
var bag = [];             // 중복 없이 순환 출제용

function loadHigh(mode){
  try { return parseInt(localStorage.getItem('termrain_high_'+mode)||'0',10)||0; }
  catch(e){ return 0; }
}
function saveHigh(mode,val){
  try { localStorage.setItem('termrain_high_'+mode, String(val)); } catch(e){}
}

var MODES = {
  easy:   { fall:22,  spawn:2600, accel:0.055, maxConcurrent:2, sec:75 },
  normal: { fall:34,  spawn:1900, accel:0.085, maxConcurrent:3, sec:60 },
  hard:   { fall:50,  spawn:1350, accel:0.12,  maxConcurrent:4, sec:45 },
  redpill:{ fall:20,  spawn:2200, accel:0.02,  maxConcurrent:1, sec:120 }
};
var redpillMode=false, redpillIdx=0;

var elScore=document.getElementById('score'),
    elLevel=document.getElementById('level'),
    elCombo=document.getElementById('combo'),
    elLives=document.getElementById('lives'),
    elTime=document.getElementById('time'),
    elTfill=document.getElementById('tfill'),
    input=document.getElementById('typed'),
    pauseBtn=document.getElementById('pauseBtn');

function measure(){ fieldH=field.clientHeight; fieldW=field.clientWidth; }
window.addEventListener('resize', measure);

function norm(s){ return s.toLowerCase().replace(/\s+/g,'').replace(/[’']/g,"'"); }

function drawBag(){
  if(bag.length===0){ bag = TERMS.slice(); for(var i=bag.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=bag[i];bag[i]=bag[j];bag[j]=t;} }
  return bag.pop();
}

function spawn(){
  if(drops.length >= cfg.maxConcurrent) return;

  // 레벨 2부터 약 22% 확률로 함정 등장
  var isTrap = (level>=2) && (Math.random() < 0.22);
  var data = isTrap ? TRAPS[Math.floor(Math.random()*TRAPS.length)] : drawBag();
  var el = document.createElement('div');
  if(isTrap){
    el.className = 'drop trap';
  } else {
    el.className = 'drop' + (Math.random()<0.4?' amber':'');
  }
  el.innerHTML = '<span class="typed"></span>' + '<span class="rest">'+data.term+'</span>';
  field.appendChild(el);
  var w = el.offsetWidth;
  var x = 40 + Math.random()*(fieldW-80);
  x = Math.max(w/2+8, Math.min(fieldW-w/2-8, x));
  var drop = { el:el, data:data, x:x, y:-10, isTrap:isTrap,
    speed: cfg.fall + Math.random()*10 + (level-1)*cfg.accel*14,
    typedEl: el.querySelector('.typed'), restEl: el.querySelector('.rest') };
  el.style.left = x+'px';
  el.style.top = '-10px';
  drops.push(drop);
}

function update(ts){
  if(!running) return;
  if(paused || trapFreeze){ lastTs = ts; rafId = requestAnimationFrame(update); return; }
  if(!lastTs) lastTs = ts;
  var dt = (ts-lastTs)/1000; lastTs = ts;

  // 시간 카운트다운
  timeLeft -= dt;
  if(timeLeft<0) timeLeft=0;
  elTime.textContent = Math.ceil(timeLeft);
  var tpct = (timeLeft/timeTotal)*100;
  elTfill.style.width = tpct+'%';
  if(tpct<=25) elTfill.classList.add('low'); else elTfill.classList.remove('low');
  if(timeLeft<=0){ endGame('time'); return; }

  spawnTimer += dt*1000;
  var interval = cfg.spawn / (1 + (level-1)*0.12);
  if(spawnTimer >= interval){ spawnTimer=0; spawn(); }

  for(var i=drops.length-1;i>=0;i--){
    var d = drops[i];
    d.y += d.speed*dt;
    d.el.style.top = d.y+'px';
    if(d.y >= fieldH-22){
      field.removeChild(d.el);
      drops.splice(i,1);
      loseLife();
    }
  }
  rafId = requestAnimationFrame(update);
}

function togglePause(){
  if(!running) return;
  paused = !paused;
  pauseBtn.textContent = paused ? '▶' : '❚❚';
  if(paused){
    showPauseOverlay(true);
    AudioEngine.stopBGM();
  } else {
    showPauseOverlay(false);
    AudioEngine.startBGM();
    input.focus();
  }
}

function showPauseOverlay(show){
  var ov = document.getElementById('pauseOverlay');
  ov.style.display = show ? 'flex' : 'none';
}

function loseLife(){
  combo=0; elCombo.textContent=0; misses++;
  lives--;
  elLives.textContent = lives>0 ? Array(lives+1).join('♥ ').trim() : '—';
  flashField();
  AudioEngine.sfx.miss();
  if(lives<=0) endGame();
}

function flashField(){
  field.style.boxShadow='inset 0 0 60px rgba(255,60,60,0.5)';
  setTimeout(function(){ field.style.boxShadow=''; },160);
}

// 함정 단어를 쳤을 때 — 감점 + 프리즈 + "아니야~!" + 야유음
var trapFreeze=false;
function hitTrap(d){
  var idx = drops.indexOf(d);
  if(idx>-1) drops.splice(idx,1);
  d.el.remove();
  combo=0; elCombo.textContent=0;
  score = Math.max(0, score-20);
  elScore.textContent = score;
  AudioEngine.sfx.trap();
  // "아니야~!" 오버레이 빵 + 화면 흔들림 + 1.2초 프리즈
  var ov=document.getElementById('nopeOverlay');
  var msg = d.data.joke
    ? '함정이에요 ㅋㅋ  −20점'
    : '<b>'+d.data.term+'</b> 은(는) 가짜!  진짜는 <b style="color:#8affc0;">'+d.data.real+'</b>  −20점';
  document.getElementById('nopeMsg').innerHTML = msg;
  ov.style.display='flex';
  field.classList.add('shake');
  trapFreeze=true;
  setTimeout(function(){
    ov.style.display='none';
    field.classList.remove('shake');
    trapFreeze=false;
    if(running && !paused) input.focus();
  }, 1200);
}

function tryMatch(){
  if(!running || paused) return;
  var val = norm(input.value);
  if(!val) return;
  // 가장 아래(위험한) 것부터 매칭
  var sorted = drops.slice().sort(function(a,b){return b.y-a.y;});
  for(var i=0;i<sorted.length;i++){
    var d = sorted[i];
    if(norm(d.data.term) === val){
      if(d.isTrap) hitTrap(d); else hit(d);
      input.value='';
      refreshHighlights();
      return;
    }
  }
  refreshHighlights();
}

// 입력 중 접두어 하이라이트
function refreshHighlights(){
  var val = norm(input.value);
  for(var i=0;i<drops.length;i++){
    var d = drops[i];
    var t = norm(d.data.term);
    if(val && t.indexOf(val)===0){
      // 매칭된 글자 수만큼 원본에서 하이라이트
      var raw = d.data.term, acc='', cnt=0, need=val.length;
      for(var k=0;k<raw.length && cnt<need;k++){
        acc += raw[k];
        if(!/\s/.test(raw[k]) && !/[’']/.test(raw[k])) cnt++;
      }
      d.typedEl.textContent = acc;
      d.restEl.textContent = raw.slice(acc.length);
    } else {
      d.typedEl.textContent='';
      d.restEl.textContent = d.data.term;
    }
  }
}

function hit(d){
  var idx = drops.indexOf(d);
  if(idx>-1) drops.splice(idx,1);
  burst(d.x, d.y);
  d.el.remove();
  hits++; combo++; if(combo>maxCombo) maxCombo=combo;
  var gain = 10 + combo*2;
  score += gain;
  elScore.textContent = score;
  elCombo.textContent = combo;
  if(combo>=2) AudioEngine.sfx.combo(combo); else AudioEngine.sfx.hit();
  // 레벨업: 5개 맞힐 때마다
  var newLevel = 1 + Math.floor(hits/5);
  if(newLevel!==level){ level=newLevel; elLevel.textContent=level; AudioEngine.sfx.level(); }
  showMeaningPop(d.data, d.x, d.y);
}

function showMeaningPop(data, x, y){
  var pop=document.createElement('div');
  pop.className='meaning-pop';
  pop.innerHTML='<b>'+data.term+'</b> '+data.ko;
  field.appendChild(pop);
  // 위치: 터진 지점 기준, 화면 좌우로 안 넘치게
  var fw=field.clientWidth;
  pop.style.left = Math.max(8, Math.min(fw-8, x)) + 'px';
  pop.style.top = (y-8) + 'px';
  setTimeout(function(){ pop.classList.add('fade'); }, 40);
  setTimeout(function(){ pop.remove(); }, 1700);
}

// 파티클 폭발
function burst(x,y){
  for(var i=0;i<10;i++){
    var p=document.createElement('div');
    p.style.cssText='position:absolute;z-index:25;width:4px;height:4px;border-radius:50%;background:'+(Math.random()<0.5?'#2bff88':'#fff4b0')+';box-shadow:0 0 6px #2bff88;left:'+x+'px;top:'+y+'px;pointer-events:none;';
    field.appendChild(p);
    var ang=Math.random()*Math.PI*2, dist=20+Math.random()*40;
    var dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
    p.animate([{transform:'translate(0,0)',opacity:1},{transform:'translate('+dx+'px,'+dy+'px)',opacity:0}],{duration:450+Math.random()*200,easing:'ease-out'});
    (function(pp){ setTimeout(function(){ pp.remove(); },700); })(p);
  }
}

input.addEventListener('input', function(){ refreshHighlights(); });
input.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ e.preventDefault(); togglePause(); return; }
  if(e.key==='Enter' || e.key===' '){
    if(e.key==='Enter'){ e.preventDefault(); tryMatch(); }
  }
});
// 매 입력마다 완성 여부 자동 체크 (Enter 없이도 터지게)
input.addEventListener('input', function(){
  var val=norm(input.value);
  for(var i=0;i<drops.length;i++){
    if(norm(drops[i].data.term)===val){ tryMatch(); return; }
  }
});

function startGame(mode){
  cfg = MODES[mode]; curMode = mode;
  redpillMode = (mode==='redpill'); redpillIdx = 0;
  document.getElementById('startOverlay').style.display='none';
  document.getElementById('endOverlay').style.display='none';
  showPauseOverlay(false);
  drops.forEach(function(d){ d.el.remove(); }); drops=[];

  // 빨간약: 채팅 모드 (떨어지는 게임 아님)
  if(redpillMode){ startChat(); return; }

  score=0; combo=0; maxCombo=0; hits=0; misses=0; level=1; lives=3;
  elScore.textContent=0; elCombo.textContent=0; elLevel.textContent=1;
  elLives.textContent='♥ ♥ ♥';
  elLives.style.display='';
  timeTotal=cfg.sec; timeLeft=cfg.sec;
  elTime.textContent=cfg.sec; elTfill.style.width='100%'; elTfill.classList.remove('low');
  paused=false; pauseBtn.textContent='❚❚';
  bag=[]; spawnTimer=0; lastTs=0; running=true;
  measure();
  input.value=''; input.focus();
  input.placeholder = '여기에 타이핑…';
  AudioEngine.resume();
  AudioEngine.sfx.start();
  AudioEngine.startBGM();
  spawn();
  rafId = requestAnimationFrame(update);
}

// 빨간약 독백 엔진 — 문단 단위, 클릭/스페이스로 진행, CRT 타이핑
// ============================================================
var chatTimers=[];
function clearChatTimers(){ chatTimers.forEach(function(t){ clearTimeout(t); clearInterval(t); }); chatTimers=[]; }

var monoIdx=0, monoTyping=false, monoBox=null, monoEl=null, monoHint=null, monoAdvance=null;

function startChat(){
  running=true; paused=false;
  AudioEngine.resume(); AudioEngine.startBGM();
  document.getElementById('hudGame').style.display='none';
  // 독백 중에는 게임 입력창이 Enter/스페이스를 가로채지 않도록 차단
  if(input){ input.blur(); input.disabled=true; }
  var old=document.getElementById('chatBox'); if(old) old.remove();
  monoBox=document.createElement('div');
  monoBox.className='chat'; monoBox.id='chatBox';
  monoEl=document.createElement('div'); monoEl.className='mono';
  monoHint=document.createElement('div'); monoHint.className='mono-hint'; monoHint.textContent='▼ 클릭하여 계속';
  monoBox.appendChild(monoEl); monoBox.appendChild(monoHint);
  field.appendChild(monoBox);
  clearChatTimers();
  monoIdx=0;
  // 진행 입력: 클릭 또는 스페이스/엔터
  monoAdvance=function(e){
    if(e && e.type==='keydown' && e.key!==' ' && e.key!=='Enter') return;
    if(e && e.preventDefault) e.preventDefault();
    if(monoTyping){ finishMonoLine(); }   // 타이핑 중이면 즉시 완성(스킵)
    else { nextMonoLine(); }
  };
  monoBox.addEventListener('click', monoAdvance);
  document.addEventListener('keydown', monoAdvance);
  nextMonoLine();
}

var _monoIv=null, _monoCur=null;
function nextMonoLine(){
  if(!running) return;
  if(monoIdx>=REDPILL.length){ endMono(); return; }
  monoHint.classList.remove('show');
  var para=REDPILL[monoIdx++];
  // 이전 문단은 지우고, 새 문단만 중앙에 표시
  monoEl.innerHTML='';
  var p=document.createElement('div');
  monoEl.appendChild(p);
  typeMono(p, para);
  monoBox.scrollTop=0;
}

// HTML 태그는 즉시 반영하고, 보이는 텍스트만 한 글자씩 타이핑
function typeMono(p, html){
  monoTyping=true; _monoCur={p:p, html:html};
  // 토큰화: 태그 or 텍스트
  var tokens=html.match(/<[^>]+>|[^<]+/g)||[];
  var ti=0, ci=0, out='';
  AudioEngine.sfx && AudioEngine.sfx.hit && AudioEngine.sfx.hit();
  _monoIv=setInterval(function(){
    if(!running){ clearInterval(_monoIv); return; }
    if(ti>=tokens.length){ clearInterval(_monoIv); finishMonoLine(); return; }
    var tk=tokens[ti];
    if(tk.charAt(0)==='<'){ out+=tk; ti++; ci=0; }   // 태그는 통째로
    else {
      out+=tk.charAt(ci++);
      if(ci>=tk.length){ ti++; ci=0; }
    }
    p.innerHTML=out+'<span class="cursor">&nbsp;</span>';
    monoBox.scrollTop=monoBox.scrollHeight;
  }, 20);
  chatTimers.push(_monoIv);
}

function finishMonoLine(){
  if(_monoIv) clearInterval(_monoIv);
  monoTyping=false;
  if(_monoCur){ _monoCur.p.innerHTML=_monoCur.html; }  // 타이핑 끝난 문단은 커서 제거
  monoBox.scrollTop=monoBox.scrollHeight;
  if(monoIdx>=REDPILL.length){ endMono(); }
  else { monoHint.classList.add('show'); }
}

function endMono(){
  // 마지막 커서 정리 후 파란약 노출
  monoHint.classList.remove('show');
  var t=setTimeout(function(){ if(running) showBluepill(); }, 600);
  chatTimers.push(t);
}

function showBluepill(){
  running=false;
  AudioEngine.stopBGM();
  if(monoAdvance){ document.removeEventListener('keydown', monoAdvance); }
  document.getElementById('bluepillBtn').classList.add('show');
}

function endGame(reason){
  running=false; paused=false;
  if(rafId) cancelAnimationFrame(rafId);
  clearChatTimers();
  AudioEngine.stopBGM();
  showPauseOverlay(false);
  drops.forEach(function(d){ d.el.remove(); }); drops=[];

  // 일반 모드: 숨겼던 줄 복구
  document.getElementById('finalHits').parentNode.style.display='';
  document.getElementById('finalAcc').parentNode.style.display='';

  AudioEngine.sfx.over();
  var total = hits+misses;
  var acc = total? Math.round(hits/total*100):0;
  document.getElementById('finalScore').textContent=score;
  document.getElementById('finalHits').textContent=hits;
  document.getElementById('finalCombo').textContent=maxCombo;
  document.getElementById('finalAcc').textContent=acc+'%';
  var head = document.getElementById('endHead');
  if(head) head.textContent = (reason==='time') ? "TIME'S UP" : 'GAME OVER';
  var grade;
  if(score>=400) grade='🏆 타자 장인 — 용어도 손가락도 완벽';
  else if(score>=250) grade='👍 훌륭해요 — 거의 다 잡았어요';
  else if(score>=120) grade='📖 좋아요 — 몇 개만 더 익히면 됩니다';
  else grade='💪 연습 시작 — 뜻을 보며 천천히 다시';
  document.getElementById('finalGrade').textContent=grade;

  // 최고점수 (난이도별, localStorage)
  var prevHigh = loadHigh(curMode);
  var recEl = document.getElementById('finalRecord');
  if(score > prevHigh){
    saveHigh(curMode, score);
    recEl.innerHTML = '★ NEW RECORD! ★ <span style="color:#8affc0;">'+score+'</span> ('+curMode.toUpperCase()+')';
    recEl.style.color = '#fff4b0';
    AudioEngine.sfx.record();
  } else {
    recEl.innerHTML = curMode.toUpperCase()+' 최고점 <span style="color:#8affc0;">'+prevHigh+'</span>';
    recEl.style.color = '#6fae85';
  }
  updateStartHigh();

  document.getElementById('endOverlay').style.display='flex';
}

function updateStartHigh(){
  var el=document.getElementById('startHigh');
  if(el) el.innerHTML = 'HIGH SCORE &nbsp; EASY <b>'+loadHigh('easy')+'</b> &nbsp;·&nbsp; NORMAL <b>'+loadHigh('normal')+'</b> &nbsp;·&nbsp; HARD <b>'+loadHigh('hard')+'</b>';
}

function backToStart(){
  // 진행 중이던 게임 완전 정지
  running=false; paused=false;
  if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
  clearChatTimers();
  if(monoAdvance){ document.removeEventListener('keydown', monoAdvance); monoAdvance=null; }
  monoTyping=false; _monoIv=null; _monoCur=null;
  if(input){ input.disabled=false; }   // 게임 입력창 복구
  AudioEngine.stopBGM();
  drops.forEach(function(d){ if(d.el) d.el.remove(); }); drops=[];
  var chat=document.getElementById('chatBox'); if(chat) chat.remove();
  document.getElementById('bluepillBtn').classList.remove('show');
  document.getElementById('hudGame').style.display='';
  pauseBtn.textContent='❚❚';
  showPauseOverlay(false);
  document.getElementById('endOverlay').style.display='none';
  document.getElementById('startOverlay').style.display='flex';
}

measure();
updateStartHigh();
</script>
</body>
</html>
